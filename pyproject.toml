[project]
name = "quittance"
version = "0.1.0"
description = "Three-way settlement reconciliation with a deterministic verifier"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
llm = ["anthropic>=0.40"]

[project.scripts]
quittance = "quittance.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quittance*"]

[tool.ruff]
line-length = 100
target-version = "py311"
